<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Meeting Coach</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f4f6;min-height:100vh}main{width:min(1100px,100%);margin:auto;padding:10px;min-height:100vh}.tabs{display:flex;gap:6px;margin-bottom:6px}.tab{flex:1;background:#20293a;color:#bbb;padding:7px}.tab.on{background:#374151;color:#fff}.page{display:none}.page.on{display:block}.coachGrid{display:grid;grid-template-columns:minmax(390px,1fr) minmax(330px,.9fr);gap:18px;align-items:center;min-height:calc(100vh - 62px)}.coachGrid.blocksOff{grid-template-columns:1fr}.left{display:flex;align-items:center;justify-content:center;gap:12px}.sideControls{height:min(58vh,330px);display:flex;flex-direction:column;align-items:center;gap:7px}.vmic{height:100%;width:42px;background:#080c16;border-radius:12px;overflow:hidden;position:relative;border:1px solid #293247}.vfill{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(0deg,#22c55e,#f59e0b,#ef4444)}.vlabel{font-size:10px;font-weight:800;color:#9ca3af}.vval{font:800 11px ui-monospace,monospace}.lightBox{display:flex;flex-direction:column;align-items:center;gap:8px}.light{width:min(58vh,38vw,390px);min-width:250px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:#374151;box-shadow:0 0 40px #0008;transition:width .2s}.blocksOff .light{width:min(72vh,62vw,560px)}.light.green{background:#22c55e;color:#07150c;box-shadow:0 0 65px #22c55e55}.light.amber{background:#f59e0b;color:#211300;box-shadow:0 0 65px #f59e0b55}.light.red{background:#ef4444;box-shadow:0 0 75px #ef444466}.timer{font-size:clamp(52px,8vw,92px);font-weight:900}.state{font-weight:900;letter-spacing:.08em}.reset{background:#293247;color:#f3f4f6;padding:9px 18px}.right{display:flex;flex-direction:column;gap:10px}.toggleRow{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:13px;color:#cbd5e1}.switch{position:relative;width:42px;height:24px}.switch input{display:none}.slider{position:absolute;inset:0;background:#374151;border-radius:20px}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#22c55e}.switch input:checked+.slider:before{transform:translateX(18px)}.timeline{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.tick{aspect-ratio:1;border-radius:4px;background:#20293a;border:1px solid #30394d}.tick.me{background:#22c55e;border-color:#22c55e}.tick.other{background:#64748b;border-color:#64748b}.tick.uncertain{background:#f59e0b;border-color:#f59e0b}.tick.latest{outline:2px solid #f3f4f6;outline-offset:1px}.legend{display:flex;gap:11px;flex-wrap:wrap;color:#9ca3af;font-size:11px}.key{display:inline-flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:2px;background:#20293a}.dot.me{background:#22c55e}.dot.other{background:#64748b}.dot.uncertain{background:#f59e0b}.summary{font-size:12px;color:#cbd5e1}.handoff{display:none;background:#2a171b;border:1px solid #7f3138;border-radius:14px;padding:13px}.handoff.on{display:block}.handoffTop{display:flex;justify-content:space-between;gap:8px;color:#fca5a5;font-weight:850;margin-bottom:9px}.question{background:#30252b;border:1px solid #49363e;border-radius:10px;padding:10px 12px;margin-top:7px;font-size:15px}.panel{background:#151c2d;border:1px solid #293247;border-radius:15px;padding:14px;margin:10px 0}.meter{height:22px;background:#080c16;border-radius:11px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:750;display:block;margin-bottom:6px}input[type=range]{width:100%}button{border:0;border-radius:10px;padding:10px;font-weight:800;background:#e5e7eb;color:#111827}.secondary{background:#293247;color:#f3f4f6}.active{outline:3px solid #22c55e}.err{text-align:center;color:#fca5a5}.mono{font-family:ui-monospace,monospace;white-space:pre-wrap;font-size:12px;color:#cbd5e1}.bigclass{text-align:center;font-size:32px;font-weight:900;padding:14px}.hint{color:#9ca3af;font-size:12px;line-height:1.4}@media(max-width:720px){main{padding:7px}.coachGrid,.coachGrid.blocksOff{grid-template-columns:1fr;min-height:auto}.coachGrid.blocksOff .right{display:none}.left{gap:8px}.light{width:min(43vh,54vw,300px);min-width:180px}.blocksOff .light{width:min(55vh,76vw,430px)}.sideControls{height:min(39vh,250px)}.timeline{grid-template-columns:repeat(12,1fr)}.tabs{margin-bottom:3px}.question{font-size:13px;padding:8px}}
</style></head><body><main><div class="tabs"><button class="tab on" data-p="coach">COACH</button><button class="tab" data-p="debug">DEBUG</button></div>
<div id="coach" class="page on"><div class="coachGrid" id="coachGrid"><div class="left"><div class="sideControls"><div class="vmic"><div class="vfill" id="vfill"></div></div><div class="vlabel">MIC</div><div class="vval" id="level">0</div></div><div class="lightBox"><div class="light" id="light"><div><div class="timer" id="timer">00:00</div><div class="state" id="state">LISTENING</div></div></div><button id="reset" class="reset">↻ RESET</button></div></div><div class="right" id="right"><div class="toggleRow"><label class="switch"><input id="showBlocks" type="checkbox" checked><span class="slider"></span></label><span>Show blocks</span></div><div id="blockArea"><div class="timeline" id="timeline"></div><div class="legend" style="margin-top:9px"><span class="key"><i class="dot me"></i>YOU</span><span class="key"><i class="dot other"></i>OTHERS</span><span class="key"><i class="dot uncertain"></i>UNCERTAIN</span><span class="key"><i class="dot"></i>QUIET</span></div><div class="summary" id="summary"></div></div><div class="handoff" id="handoff"><div class="handoffTop"><span id="longTurn">LONG TURN</span><span>HAND IT BACK</span></div><div id="questions"></div></div></div></div></div>
<div id="debug" class="page"><section class="panel"><label>SPEAKER VERIFICATION</label><div class="hint">Hold and speak normally for 15-30 seconds. Voice embedding stays on this tablet.</div><button class="secondary" id="enchris" style="width:100%;margin-top:10px">HOLD: ENROL CHRIS</button><div id="counts" class="hint" style="margin-top:8px">0 voice samples</div><div id="class" class="bigclass">NOT ENROLLED</div><div>Chris similarity <b id="cs">0%</b></div><div style="margin-top:10px"><label>CHRIS MATCH THRESHOLD <span id="sv">55%</span></label><input id="sth" type="range" min="35" max="80" value="55"></div><div class="grid2" style="margin-top:10px"><button class="secondary" id="clear">CLEAR CHRIS VOICE</button><button class="secondary" id="refresh">REFRESH HARDWARE</button></div></section><section class="panel"><label>AUDIO HARDWARE</label><div id="hardware" class="mono">Loading...</div></section><section class="panel"><label>LIVE CHANNEL TEST</label><div>LEFT / MONO <span id="lv">0</span></div><div class="meter"><div class="fill" id="lf"></div></div><div style="margin-top:8px">RIGHT <span id="rv">0</span></div><div class="meter"><div class="fill" id="rf"></div></div><div id="ratio" class="hint" style="margin-top:8px"></div></section><section class="panel"><label>DIAGNOSTIC LOG</label><div id="log" class="mono"></div></section></div><div class="err" id="err"></div>
<script>(()=>{const $=x=>document.getElementById(x);let speaking=false,speechStart=null,lastChris=0,meetingStart=performance.now(),lastBucket=-1,buckets=[],promptTurn=null;const GRACE=3200,BUCKET=5000,MAX=60;const QUESTIONS=["What are your thoughts on this?","Does that align with what you're seeing?","How does that sound from your side?","What am I missing?","How would you approach it?","What feels most important to you here?","Where would you like to take this next?","What concerns you most about that?","How does that compare with your experience?","What would be useful for us to explore next?","What do you think the right next step is?","Is there another angle we should consider?"];const saved=localStorage.getItem('speakerThreshold')||55;$('sth').value=saved;
function fmt(ms){let s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function ncall(f,d=0){try{return window.NativeAudio?NativeAudio[f]():d}catch(e){return d}}function choose3(){return [...QUESTIONS].sort(()=>Math.random()-.5).slice(0,3)}function start(now){if(speaking)return;speaking=true;speechStart=now;promptTurn=null}function stop(){speaking=false;speechStart=null;promptTurn=null;$('handoff').classList.remove('on')}
function showPrompts(e){if(e<60000){$('handoff').classList.remove('on');return}if(promptTurn!==speechStart){promptTurn=speechStart;$('questions').innerHTML=choose3().map(q=>`<div class="question">${q}</div>`).join('')}$('longTurn').textContent='LONG TURN '+fmt(e);$('handoff').classList.add('on')}
function light(now){let l=$('light');l.className='light';if(!speaking){$('timer').textContent='00:00';$('state').textContent='LISTENING';showPrompts(0);return}let e=now-speechStart;$('timer').textContent=fmt(e);if(e<30000){l.classList.add('green');$('state').textContent='YOUR TURN'}else if(e<60000){l.classList.add('amber');$('state').textContent='WRAP UP'}else{l.classList.add('red');$('state').textContent='HAND IT BACK'}showPrompts(e)}
function addVote(now,c,level){let idx=Math.floor((now-meetingStart)/BUCKET);if(idx!==lastBucket){lastBucket=idx;buckets.push({me:0,other:0,uncertain:0,quiet:0});if(buckets.length>MAX)buckets.shift()}let b=buckets[buckets.length-1];if(!b)return;if(level<2)b.quiet++;else if(c==='CHRIS')b.me++;else if(c==='NOT CHRIS')b.other++;else b.uncertain++}function winner(b){return [['me',b.me],['other',b.other],['uncertain',b.uncertain],['quiet',b.quiet]].sort((a,z)=>z[1]-a[1])[0][0]}
function drawTimeline(){let el=$('timeline');el.innerHTML='';let states=buckets.map(winner);for(let i=0;i<MAX;i++){let d=document.createElement('div'),off=MAX-states.length;if(i>=off)d.className='tick '+states[i-off]+(i===MAX-1?' latest':'');else d.className='tick';el.appendChild(d)}let c={me:0,other:0,uncertain:0,quiet:0};states.forEach(x=>c[x]++);let n=states.length||1,p=x=>Math.round(100*c[x]/n);$('summary').textContent=states.length?`Chris ${p('me')}% · Others ${p('other')}% · Quiet ${p('quiet')}%`:''}
function blocks(on){$('showBlocks').checked=on;$('blockArea').style.display=on?'block':'none';$('coachGrid').classList.toggle('blocksOff',!on);localStorage.setItem('showBlocks',on?'1':'0')}$('showBlocks').onchange=e=>blocks(e.target.checked);blocks(localStorage.getItem('showBlocks')!=='0');
function hardware(){try{let dev=JSON.parse(NativeAudio.devices()),st=JSON.parse(NativeAudio.status());$('hardware').textContent=`Build: v0.5-glance-coach\nPackage: uk.co.cgunner.meetingcoach\nCapture source: ${st.source}\nRate: ${st.sampleRate} Hz\nCapture channels: ${st.channels}\nSpeaker model: ${st.modelReady?'READY':'LOADING'}\nChris enrolled: ${st.enrolled?'YES':'NO'}\n\nInput devices:\n`+dev.map(d=>`#${d.id} ${d.type} - ${d.product}\n  channels: ${d.channels.length?d.channels.join(', '):'not reported'}\n  rates: ${d.rates.length?d.rates.join(', '):'not reported'}`).join('\n')}catch(e){$('hardware').textContent='Hardware query failed: '+e}}$('refresh').onclick=hardware;$('clear').onclick=()=>NativeAudio.clearEnroll();const eb=$('enchris');eb.onpointerdown=e=>{e.preventDefault();eb.classList.add('active');NativeAudio.beginEnroll('chris')};const end=e=>{e.preventDefault();eb.classList.remove('active');NativeAudio.endEnroll()};eb.onpointerup=end;eb.onpointercancel=end;function setThreshold(){let v=+$('sth').value;$('sv').textContent=v+'%';localStorage.setItem('speakerThreshold',v);try{NativeAudio.setSpeakerThreshold(v/100)}catch(e){}}$('sth').oninput=setThreshold;setThreshold();
function loop(now){let v=+ncall('level',0),l=+ncall('left',0),r=+ncall('right',0);$('vfill').style.height=v+'%';$('level').textContent=Math.round(v);$('lf').style.width=l+'%';$('rf').style.width=r+'%';$('lv').textContent=Math.round(l);$('rv').textContent=Math.round(r);$('ratio').textContent=`L/R ratio ${r>1?(l/r).toFixed(2):'-'} | ${ncall('channels',1)} capture channel(s)`;let er=ncall('error','');$('err').textContent=er;try{let s=JSON.parse(NativeAudio.status());$('counts').textContent=s.enrolled?`Chris voice enrolled${s.enrollSamples?' - '+s.enrollSamples+' fresh samples':''}`:`${s.enrollSamples} enrolment samples captured`;$('class').textContent=s.classification;$('cs').textContent=Math.round(s.chrisScore*100)+'%';if(s.enrolled){addVote(now,s.classification,v);if(s.classification==='CHRIS'){lastChris=now;if(!speaking)start(now)}else if(s.classification==='NOT CHRIS'&&speaking&&now-lastChris>GRACE)stop()}$('log').textContent=`build=v0.5-glance-coach\nrecording=${s.recording}\nmodelReady=${s.modelReady}\nenrolled=${s.enrolled}\nsource=${s.source}\nsampleRate=${s.sampleRate}\nchannels=${s.channels}\nlevel=${v.toFixed(1)} left=${l.toFixed(1)} right=${r.toFixed(1)}\nclassification=${s.classification}\nchrisSimilarity=${s.chrisScore.toFixed(3)}\nthreshold=${s.threshold.toFixed(2)}${er?'\nerror='+er:''}`}catch(e){}light(now);drawTimeline();requestAnimationFrame(loop)}
$('reset').onclick=()=>{meetingStart=performance.now();buckets=[];lastBucket=-1;speaking=false;speechStart=null;lastChris=0;promptTurn=null;$('handoff').classList.remove('on');drawTimeline()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on');if(b.dataset.p==='debug')hardware()});drawTimeline();try{NativeAudio.start()}catch(e){$('err').textContent=String(e)}requestAnimationFrame(loop)})();</script></body></html>
